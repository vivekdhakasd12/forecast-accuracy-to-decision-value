[project]
name = "riskaware-pv"
version = "0.1.0"
description = "Probabilistic day-ahead PV forecasting and risk-aware battery dispatch under concept drift"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "lightgbm>=4.0", "xgboost>=2.0", "matplotlib>=3.8", "shap>=0.44",
  "statsmodels>=0.14", "pyarrow>=14", "pyyaml>=6.0", "river>=0.21", "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
